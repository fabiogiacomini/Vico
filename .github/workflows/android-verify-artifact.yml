name: Verify existing Android preview artifact
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Same-repository Android build run to verify
        required: true
        type: string
      source_sha:
        description: Exact source SHA of that unsigned APK
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VICO_BUILD_RUN: ${{ inputs.build_run_id }}
      VICO_SOURCE_SHA: ${{ inputs.source_sha }}
      VICO_SMOKE_APK: dist-android/Vico-ci-smoke.apk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify build origin and download unchanged input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VICO_BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$VICO_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VICO_BUILD_RUN" > "$RUNNER_TEMP/vico-build-run.json"
          python3 - <<'PY'
          import json,os
          r=json.load(open(os.environ['RUNNER_TEMP']+'/vico-build-run.json'))
          assert r['head_sha']==os.environ['VICO_SOURCE_SHA']
          assert r['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert r['event']=='workflow_dispatch' and r['head_branch']=='main'
          assert r['path']=='.github/workflows/android-preview.yml'
          PY
          gh run download "$VICO_BUILD_RUN" --repo "$GITHUB_REPOSITORY" -n android-owner-signing-input -D dist-android
          sha256sum --check dist-android/unsigned.sha256
          rm -rf dist-android/smoke
          mkdir -p dist-android/smoke
          cp "$RUNNER_TEMP/vico-build-run.json" dist-android/smoke/build-run.json
      - name: Sign only the disposable emulator copy
        run: |
          vico_build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore "$RUNNER_TEMP/vico-ci-test.p12" -storetype PKCS12 -storepass ci-test-only -keypass ci-test-only -alias ci-test -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Disposable Vico CI test'
          "$vico_build_tools/apksigner" sign --ks "$RUNNER_TEMP/vico-ci-test.p12" --ks-key-alias ci-test --ks-pass pass:ci-test-only --out "$VICO_SMOKE_APK" dist-android/Vico-unsigned.apk
          "$vico_build_tools/apksigner" verify "$VICO_SMOKE_APK"
      - name: Enable emulator virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            adb shell wm size 720x1600
            adb shell wm density 280
            sleep 10
            python3 scripts/android-smoke.py
      - name: Remove disposable signer and test APK
        if: always()
        run: rm -f "$RUNNER_TEMP/vico-ci-test.p12" "$VICO_SMOKE_APK"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-owner-signing-input
          path: dist-android/
          retention-days: 7
          if-no-files-found: warn
