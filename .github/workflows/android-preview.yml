name: Build and verify Android preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-preview
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
      VICO_SMOKE_APK: dist-android/Vico-ci-smoke.apk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec expo prebuild --platform android --no-install
      - name: Verify native configuration
        run: |
          grep -q 'expo.sqlite.useSQLCipher=true' android/gradle.properties
          grep -q 'signingConfig null // VICO_LOCAL_SIGNING' android/app/build.gradle
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
      - name: Include open source notices
        run: |
          python3 scripts/collect-notices.py dist-android/THIRD-PARTY-NOTICES.zip
          mkdir -p android/app/src/main/assets
          cp dist-android/THIRD-PARTY-NOTICES.zip android/app/src/main/assets/THIRD-PARTY-NOTICES.zip
      - name: Build standalone unsigned release
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache --max-workers 2 -PreactNativeArchitectures=arm64-v8a,x86_64 -Pandroid.enableMinifyInReleaseBuilds=false
      - name: Prepare unsigned owner artifact and disposable smoke build
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist-android/Vico-unsigned.apk
          vico_build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore "$RUNNER_TEMP/vico-ci-test.p12" -storetype PKCS12 -storepass ci-test-only -keypass ci-test-only -alias ci-test -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Disposable Vico CI test'
          "$vico_build_tools/apksigner" sign --ks "$RUNNER_TEMP/vico-ci-test.p12" --ks-key-alias ci-test --ks-pass pass:ci-test-only --out "$VICO_SMOKE_APK" dist-android/Vico-unsigned.apk
          "$vico_build_tools/apksigner" verify "$VICO_SMOKE_APK"
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest debuggable dist-android/Vico-unsigned.apk)" = false
          unzip -l dist-android/Vico-unsigned.apk | grep 'assets/index.android.bundle'
          sha256sum dist-android/Vico-unsigned.apk > dist-android/unsigned.sha256
      - name: Enable emulator virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: python3 scripts/android-smoke.py
      - name: Remove disposable signer and test APK
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/vico-ci-test.p12" "$VICO_SMOKE_APK"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-owner-signing-input
          path: |
            dist-android/Vico-unsigned.apk
            dist-android/unsigned.sha256
            dist-android/THIRD-PARTY-NOTICES.zip
            dist-android/smoke/
          retention-days: 7
          if-no-files-found: warn
